name: Anchor
options:
  bundleIdPrefix: com.ayushnanda
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Anchor:
    type: application
    platform: iOS
    sources:
      - path: Anchor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushnanda.Anchor
        INFOPLIST_KEY_CFBundleDisplayName: Anchor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Anchor/Info.plist
      properties:
        UIAppFonts:
          - Lato-Regular.ttf
          - Lato-Medium.ttf
          - Lato-Bold.ttf
          - Lato-Italic.ttf
        UIUserInterfaceStyle: Automatic
    scheme:
      testTargets:
        - AnchorTests
  AnchorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnchorTests
    dependencies:
      - target: Anchor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushnanda.AnchorTests
        GENERATE_INFOPLIST_FILE: YES
